[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-send-py"
version = "1.0.0"
description = "Send and receive Telegram messages through the Bot API, with script triggering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["telegram", "bot", "integration", "messaging", "xdg", "cli"]
authors = [
  { name = "Gabriel Vargas Monroy" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "platformdirs>=4.2.0",
  "requests>=2.32.0",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "types-requests>=2.32.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocstrings[python]>=0.26.0",
  "mkdocs-material>=9.5.0",
]

[project.scripts]
telegram-send = "telegram_integration.presentation.cli:send_app"
telegram-listen = "telegram_integration.presentation.cli:listen_app"
telegram-integration = "telegram_integration.presentation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_integration"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/extras",
  "/README.md",
  "/Makefile",
  "/mkdocs.yml",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
send = "telegram-send {args}"
listen = "telegram-listen {args}"
test = "pytest -v tests/ {args}"

[tool.hatch.envs.test]
features = ["dev"]

[tool.hatch.envs.test.scripts]
test = "pytest -v tests/ --cov=telegram_integration --cov-report=term-missing {args}"

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean"
serve = "mkdocs serve -a localhost:8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["platformdirs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["typer.completion"]
implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["telegram_integration"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on calls such as `typer.Option(...)` in argument defaults.
"src/telegram_integration/cli.py" = ["B008"]
"src/telegram_integration/presentation/cli.py" = ["B008"]
"src/telegram_integration/presentation/completions.py" = ["B008"]
