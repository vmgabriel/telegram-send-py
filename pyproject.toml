[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-integration"
version = "1.0.0"
description = "Send and receive Telegram messages through the Bot API, with script triggering"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["telegram", "bot", "integration", "messaging"]
authors = [
  { name = "Gabriel Vargas Monroy" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mkdocs>=1.6.0",
  "mkdocstrings[python]>=0.26.0",
]

[project.scripts]
telegram-send = "telegram_integration.cli:send_app"
telegram-listen = "telegram_integration.cli:listen_app"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_integration"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts"]

[tool.hatch.envs.default]
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "pytest>=8.0.0",
]

[tool.hatch.envs.default.scripts]
send = "telegram-send {args}"
listen = "telegram-listen {args}"
test = "pytest -v tests/ {args}"

[tool.hatch.envs.test]
dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
]

[tool.hatch.envs.test.scripts]
test = "pytest -v tests/ --cov=telegram_integration --cov-report=term-missing {args}"

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs>=1.6.0",
  "mkdocstrings[python]>=0.26.0",
  "mkdocs-material>=9.5.0",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean"
serve = "mkdocs serve -a localhost:8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"